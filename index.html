<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forge - Training Log</title>
<meta name="description" content="Personal workout planner, TDEE/BMR calculator, weight goal tracker, and food log. Runs entirely in your browser.">

<!-- PWA: installability -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F14">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/calc.js"></script>
<script src="js/theme.js"></script>
<script src="js/gamestats.js"></script>
<script src="js/app.js"></script>
<script src="js/workouts.js"></script>
<script src="js/resttimer.js"></script>
<script src="js/log.js"></script>
<script src="js/progress.js"></script>
<script src="js/goals.js"></script>
<script src="js/food.js"></script>
<script src="js/barcode.js"></script>
<script src="js/bodyfat.js"></script>
<script src="js/pet.js"></script>
<script src="js/achievements.js"></script>
<script src="js/themes.js"></script>
<script>
  render();

  // PWA: register the service worker so the app becomes installable and
  // works offline. Wrapped defensively since some hosting setups (or the
  // file:// protocol) don't support service workers, that shouldn't break
  // the app itself.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed (app still works normally):', err);
      });
    });
  }
</script>
</body>
</html>
